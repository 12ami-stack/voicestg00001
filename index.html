<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Power-Up STG</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
        body { background-color: #111; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; }
        #game-container { position: fixed; inset: 0; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; background: linear-gradient(to bottom, #000005, #050515); }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn {
            padding: 12px 30px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff0055, #ffcc00);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            transition: transform 0.1s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        #powerup-display {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #333;
        }
        .gauge-slot {
            width: 70px;
            height: 20px;
            background: #222;
            border: 1px solid #444;
            font-size: 10px;
            text-align: center;
            line-height: 20px;
            color: #666;
            font-weight: bold;
        }
        .gauge-slot.active {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 8px #00ffcc;
            border-color: #fff;
        }
        #hud-info { position: fixed; top: 10px; right: 10px; text-align: right; z-index: 5; pointer-events: none; }
        #fs-btn { pointer-events: auto; background: rgba(0,0,0,0.6); color: #0fc; border: 1px solid #0fc; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        #instructions { margin: 8px 0 0 auto; max-width: 300px; color: #aaa; font-size: 12px; line-height: 1.5; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="ui-layer">
        <button id="start-btn" class="btn">GAME START</button>
    </div>
    <div id="powerup-display">
        <div class="gauge-slot" id="slot-1">SPEED UP</div>
        <div class="gauge-slot" id="slot-2">MISSILE</div>
        <div class="gauge-slot" id="slot-3">WIDE</div>
        <div class="gauge-slot" id="slot-4">LASER</div>
        <div class="gauge-slot" id="slot-5">OPTION</div>
        <div class="gauge-slot" id="slot-6">BARRIER</div>
        <div class="gauge-slot" id="slot-7">BURST</div>
        <div class="gauge-slot" id="slot-8">HYPER</div>
    </div>
</div>

<div id="hud-info">
    <button id="fs-btn" type="button">⛶ 全画面 (F)</button>
<div id="instructions">
    操作方法: 【↑ ↓ ← →】移動 ／ 【SPACE】ショット (押しっぱなしで連射)<br>
    カプセル（緑に光るP）を拾うと、自機が喋りながら<b>全8段階</b>で猛烈にパワーアップします。<br>
    【Enter】スタート／リトライ ／ 【F】全画面切替
</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start-btn');

// ゲーム状態
let gameActive = false;
let score = 0;
let keys = {};

// パワーアップ定義（8段階）
const POWER_UP_NAMES = [
    "ノーマル",
    "スピードアップ",
    "ミサイル",
    "ワイドショット",
    "貫通レーザー",
    "ツインオプション",
    "ハイパーバリア",
    "メガバースト",
    "ゴッドモード・ハイパーノヴァ"
];

const VOICE_TEXTS = [
    "",
    "スピードアップ！加速します！",
    "ミサイル装備！前方を爆撃します！",
    "ワイドショット！広範囲を制圧します！",
    "レーザー照射！すべてを貫通します！",
    "オプション展開！火力を倍加します！",
    "バリア発生！絶対防御を展開します！",
    "メガバースト！出力限界を突破！猛烈に燃えてきたぁ！",
    "ハイパーノヴァ！神の領域へ到達！我が力、とくと見よ！"
];

// エンティティ管理
let player;
let bullets = [];
let lasers = [];
let missiles = [];
let options = [];
let enemies = [];
let capsules = [];
let particles = [];
let enemySpawnTimer = 0;
let stars = [];
let rivalPhase = 0, rivalSpawnAt = 0, rival = null, warningUntil = 0; // 0:未 1:予約中 2:出現済み
let enemyBullets = [], enemyLasers = [], enemyMissiles = [];
let fullPowerPickups = 0; // レベル8でカプセルを取った回数
let endState = null; // null | 'over' | 'clear'

// 星屑の初期化（画面サイズに比例）
function initStars() {
    stars = [];
    const n = Math.max(80, Math.floor(canvas.width * canvas.height / 4500));
    for (let i = 0; i < n; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speed: Math.random() * 2 + 0.5,
            size: Math.random() * 2
        });
    }
}

// ウィンドウいっぱいにキャンバスを広げる（描画エリア自体が広がる）
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
    if (endState) drawEndScreen();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}

// 音声合成
function speak(text) {
    if (!text) return;
    // 再生中の音声を停止
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    utterance.rate = 1.2; // 少し早口でテンポよく
    utterance.pitch = 1.1;
    window.speechSynthesis.speak(utterance);
}

// プレイヤー
class Player {
    constructor() {
        this.x = 100;
        this.y = canvas.height / 2;
        this.width = 30;
        this.height = 20;
        this.baseSpeed = 4;
        this.powerLevel = 0;
        this.shootCooldown = 0;
        this.barrierHealth = 0;
    }

    get speed() {
        return this.baseSpeed + (this.powerLevel >= 1 ? 2.5 : 0);
    }

    update() {
        // 移動
        if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
        if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;
        if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
        if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;

        // 画面外制限
        if (this.x < 10) this.x = 10;
        if (this.x > canvas.width - this.width - 10) this.x = canvas.width - this.width - 10;
        if (this.y < 10) this.y = 10;
        if (this.y > canvas.height - this.height - 10) this.y = canvas.height - this.height - 10;

        // クールダウン減少
        if (this.shootCooldown > 0) this.shootCooldown--;

        // ショット
        if (keys['Space'] && this.shootCooldown === 0) {
            this.shoot();
        }

        // UI更新
        updateGauge(this.powerLevel);
    }

    shoot() {
        // パワーレベルに応じたクールダウン
        let cooldown = 12;
        if (this.powerLevel >= 7) cooldown = 4; // 猛烈連射
        else if (this.powerLevel >= 4) cooldown = 8;
        
        this.shootCooldown = cooldown;

        // 通常弾 or レーザー
        if (this.powerLevel >= 4) {
            // レーザー（太さはレベルで変化）
            let width = this.powerLevel === 4 ? 6 : (this.powerLevel >= 7 ? 24 : 12);
            lasers.push({
                x: this.x + this.width,
                y: this.y + this.height/2 - width/2,
                w: 0,
                h: width,
                damage: this.powerLevel >= 7 ? 4 : 2
            });
        } else {
            // 通常弾
            bullets.push({ x: this.x + this.width, y: this.y + this.height/2, vx: 10, vy: 0, power: 1 });
        }

        // 3: ワイドショット / 7,8: 猛烈ワイド
        if (this.powerLevel === 3) {
            bullets.push({ x: this.x + this.width, y: this.y + this.height/2, vx: 9, vy: -3, power: 1 });
            bullets.push({ x: this.x + this.width, y: this.y + this.height/2, vx: 9, vy: 3, power: 1 });
        } else if (this.powerLevel >= 7) {
            // メガバースト以上の猛烈な5方向弾
            bullets.push({ x: this.x + this.width, y: this.y + this.height/2 - 10, vx: 12, vy: -4, power: 2 });
            bullets.push({ x: this.x + this.width, y: this.y + this.height/2 + 10, vx: 12, vy: 4, power: 2 });
            bullets.push({ x: this.x + this.width, y: this.y + this.height/2 - 5, vx: 11, vy: -1.5, power: 2 });
            bullets.push({ x: this.x + this.width, y: this.y + this.height/2 + 5, vx: 11, vy: 1.5, power: 2 });
            if (this.powerLevel === 8) {
                // 神モードは後ろにも撃つ
                bullets.push({ x: this.x, y: this.y + this.height/2, vx: -12, vy: 0, power: 3 });
                bullets.push({ x: this.x, y: this.y + this.height/2, vx: -10, vy: -5, power: 3 });
                bullets.push({ x: this.x, y: this.y + this.height/2, vx: -10, vy: 5, power: 3 });
            }
        }

        // 2: ミサイル
        if (this.powerLevel >= 2) {
            missiles.push({ x: this.x + 10, y: this.y + this.height, vx: 5, vy: 4 });
            if (this.powerLevel >= 7) {
                missiles.push({ x: this.x + 10, y: this.y, vx: 5, vy: -4 });
            }
        }

        // 5: オプションからの攻撃
        if (this.powerLevel >= 5) {
            options.forEach(opt => {
                if (this.powerLevel >= 7) {
                    bullets.push({ x: opt.x, y: opt.y, vx: 12, vy: -1, power: 1 });
                    bullets.push({ x: opt.x, y: opt.y, vx: 12, vy: 1, power: 1 });
                } else {
                    bullets.push({ x: opt.x, y: opt.y, vx: 10, vy: 0, power: 1 });
                }
            });
        }
    }

    powerUp() {
        if (this.powerLevel < 8) {
            this.powerLevel++;
            speak(VOICE_TEXTS[this.powerLevel]);

            // オプション生成
            if (this.powerLevel === 5) {
                options = [{ x: this.x - 30, y: this.y - 30 }, { x: this.x - 30, y: this.y + 50 }];
            }
            // バリア付与
            if (this.powerLevel >= 6) {
                this.barrierHealth = this.powerLevel === 6 ? 3 : 10; // 猛烈にアップ
            }
        } else {
            fullPowerPickups++;
            if (fullPowerPickups === 1) speak("フルパワー！もう誰も私を止められない！");
            else if (fullPowerPickups <= 3) speak("取っても無駄だ"); // 2〜6回目の5回だけ
            score += 5000; // カンスト時はボーナス
            if (rivalPhase === 0) { rivalPhase = 1; rivalSpawnAt = performance.now() + 20000; } // 20秒後にライバル出現
        }
    }

    draw() {
        // オプション描画＆更新
        if (this.powerLevel >= 5) {
            options.forEach((opt, idx) => {
                // 自機の位置をなめらかに追従
                let targetX = this.x - 40;
                let targetY = this.y + (idx === 0 ? -35 : 35);
                opt.x += (targetX - opt.x) * 0.15;
                opt.y += (targetY - opt.y) * 0.15;

                ctx.fillStyle = 'rgba(0, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, 6, 0, Math.PI*2);
                ctx.fill();
                // コア
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, 2, 0, Math.PI*2);
                ctx.fill();
            });
        }

        // バリア
        if (this.barrierHealth > 0) {
            ctx.strokeStyle = this.powerLevel >= 7 ? 'rgba(255, 0, 255, 0.6)' : 'rgba(0, 150, 255, 0.6)';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.beginPath();
            ctx.arc(this.x + this.width/2, this.y + this.height/2, 30, 0, Math.PI*2);
            ctx.stroke();
            ctx.shadowBlur = 0; // リセット
        }

        // 自機本体
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height / 2);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.lineTo(this.x + 5, this.y + this.height / 2);
        ctx.closePath();
        ctx.fill();

        // スラスターの炎
        ctx.fillStyle = Math.random() > 0.5 ? '#ff3300' : '#ff9900';
        ctx.beginPath();
        ctx.moveTo(this.x - 2, this.y + 5);
        ctx.lineTo(this.x - 15 - Math.random()*10, this.y + this.height/2);
        ctx.lineTo(this.x - 2, this.y + this.height - 5);
        ctx.closePath();
        ctx.fill();
    }
}

// 敵クラス
class Enemy {
    constructor(type) {
        this.x = canvas.width + 20;
        this.y = Math.random() * (canvas.height - 40) + 20;
        this.type = type; // 0: 雑魚, 1: 中型, 2: 高速
        
        if (type === 1) {
            this.width = 45;
            this.height = 45;
            this.hp = 15;
            this.speed = 1.5;
            this.color = '#ff0055';
        } else if (type === 2) {
            this.width = 20;
            this.height = 20;
            this.hp = 1;
            this.speed = 6;
            this.color = '#ffcc00';
        } else {
            this.width = 25;
            this.height = 25;
            this.hp = 3;
            this.speed = 3;
            this.color = '#a020f0';
        }
    }

    update() {
        this.x -= this.speed;
        if (this.type === 1) {
            // サイン波状に上下移動
            this.y += Math.sin(this.x / 50) * 2;
        }
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        // メカニカルな目
        ctx.fillStyle = '#fff';
        ctx.fillRect(this.x + 4, this.y + this.height/3, 5, 5);
    }
}

// ライバル機（フルパワー宣言の20秒後に出現する、自機と同じ装備の敵）
class Rival {
    constructor(p) {
        this.width = 30; this.height = 20;
        this.x = canvas.width * 2; // 画面の1画面分先から接近（見える前から撃ってくる）
        this.y = canvas.height / 2;
        this.level = p.powerLevel;            // 出現時点の自機の装備（Lv8）をコピー
        this.barrier = 10; // 自機レベル8の満タンバリア（HPは無し）
        this.dead = false;
        this.cooldown = 4; this.invuln = 0; this.target = null; this.targetTimer = 0; this.contactCd = 0; this.t = 0; this.flash = 0;
        this.options = [{ x: this.x + 40, y: this.y - 35 }, { x: this.x + 40, y: this.y + 35 }];
    }
    get baseX() { return canvas.width - 200; }
    hitbox() { return { x: this.x - 6, y: this.y - 8, w: this.width + 12, h: this.height + 16 }; }
    hit() { // バリアがあれば1枚減り、無ければ撃破。被弾後は1.5秒の無敵（連続ヒット防止）
        if (this.invuln > 0) return;
        this.invuln = 90;
        this.flash = 3;
        if (this.barrier > 0) this.barrier--;
        else this.dead = true;
    }
    update() {
        this.t++;
        const sp = player.speed; // 移動速度は自機と同じ
        // 自機は眼中になく、遠くの“何か”を追って飛び回る（自機の位置は見ない）
        if (!this.target || --this.targetTimer <= 0 || Math.hypot(this.target.x - this.x, this.target.y - this.y) < 10) {
            this.target = {
                x: canvas.width * 0.3 + Math.random() * (canvas.width * 0.7 - 80),
                y: 30 + Math.random() * (canvas.height - 100)
            };
            this.targetTimer = 120 + Math.random() * 120;
        }
        const tx = this.target.x - this.x, ty = this.target.y - this.y, td = Math.hypot(tx, ty) || 1;
        if (this.x > canvas.width - 80) {          // 入場中
            this.x -= sp;
            this.y += ty / td * sp * 0.5;
        } else {
            this.x += tx / td * sp;
            this.y += ty / td * sp;
        }
        this.y = Math.max(10, Math.min(canvas.height - this.height - 10, this.y));
        this.options.forEach((o, i) => {
            o.x += (this.x + 40 - o.x) * 0.15;
            o.y += (this.y + (i === 0 ? -35 : 35) - o.y) * 0.15;
        });
        if (this.contactCd > 0) this.contactCd--;
        if (this.flash > 0) this.flash--;
        if (this.invuln > 0) this.invuln--;
        if (--this.cooldown <= 0) { this.shoot(); this.cooldown = 4; }
    }
    shoot() {
        // 自機Lv8と同じ武装・弾速・連射間隔で、左右反転して発射
        const cx = this.x, cy = this.y + this.height / 2, S = 1;
        enemyLasers.push({ x: cx, y: cy - 12, w: 0, h: 24, hit: false });
        [[-12, -4, -10], [-12, 4, 10], [-11, -1.5, -5], [-11, 1.5, 5], [12, 0, 0], [10, -5, 0], [10, 5, 0]]
            .forEach(([vx, vy, dy]) => enemyBullets.push({ x: cx, y: cy + dy, vx: vx * S, vy: vy * S }));
        enemyMissiles.push({ x: cx, y: this.y + this.height, vx: -5, vy: 4 }, { x: cx, y: this.y, vx: -5, vy: -4 });
        this.options.forEach(o => enemyBullets.push({ x: o.x, y: o.y, vx: -12 * S, vy: -S }, { x: o.x, y: o.y, vx: -12 * S, vy: S }));
    }
    draw() {
        ctx.globalAlpha = (this.invuln > 0 && Math.floor(this.invuln / 4) % 2 === 0) ? 0.4 : 1; // 無敵中は点滅
        this.options.forEach(o => {
            ctx.fillStyle = 'rgba(255, 80, 120, 0.7)';
            ctx.beginPath(); ctx.arc(o.x, o.y, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(o.x, o.y, 2, 0, Math.PI * 2); ctx.fill();
        });
        if (this.barrier > 0) {
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.6)'; ctx.lineWidth = 3;
            ctx.shadowBlur = 10; ctx.shadowColor = ctx.strokeStyle;
            ctx.beginPath(); ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 30, 0, Math.PI * 2); ctx.stroke();
            ctx.shadowBlur = 0;
        }
        ctx.fillStyle = this.flash > 0 ? '#fff' : '#ff3366';
        ctx.beginPath();
        ctx.moveTo(this.x + this.width, this.y);
        ctx.lineTo(this.x, this.y + this.height / 2);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.lineTo(this.x + this.width - 5, this.y + this.height / 2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = Math.random() > 0.5 ? '#ff3300' : '#ff9900';
        ctx.beginPath();
        ctx.moveTo(this.x + this.width + 2, this.y + 5);
        ctx.lineTo(this.x + this.width + 15 + Math.random() * 10, this.y + this.height / 2);
        ctx.lineTo(this.x + this.width + 2, this.y + this.height - 5);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function playerHit(x, y) {
    createExplosion(x, y, 12);
    if (player.barrierHealth > 0) player.barrierHealth--;
    else gameOver();
}

function drawRivalBar() {
    ctx.fillStyle = '#ff3366'; ctx.font = '20px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`RIVAL BARRIER: ${rival.barrier}`, canvas.width / 2, canvas.height - 62);
    ctx.textAlign = 'left';
}

// ライバルの出現・攻撃・被弾・撃破をまとめて処理
function updateRival(now) {
    if (rivalPhase === 1 && now >= rivalSpawnAt) {
        rival = new Rival(player); rivalPhase = 2; warningUntil = now + 3000;
        speak("警告！自機と同じ装備の敵機が出現！");
    }
    const px = player.x, py = player.y, pw = player.width, ph = player.height;
    const pcx = px + pw / 2, pcy = py + ph / 2;

    // ライバルの弾・ミサイル・レーザー
    ctx.fillStyle = '#ff4466';
    enemyBullets = enemyBullets.filter(b => {
        b.x += b.vx; b.y += b.vy;
        ctx.fillRect(b.x, b.y - 2, 8, 4);
        if (Math.hypot(pcx - b.x, pcy - b.y) < 14) { playerHit(b.x, b.y); return false; }
        return b.x > -20 && b.x < canvas.width * 3 && b.y > -20 && b.y < canvas.height + 20;
    });
    ctx.fillStyle = '#ff8800';
    enemyMissiles = enemyMissiles.filter(m => {
        m.x += m.vx; m.y += m.vy;
        ctx.fillRect(m.x, m.y, 6, 6);
        if (Math.hypot(pcx - m.x, pcy - m.y) < 14) { playerHit(m.x, m.y); return false; }
        return m.x > -20 && m.y > -20 && m.y < canvas.height + 20;
    });
    enemyLasers = enemyLasers.filter(l => {
        l.w += 40;
        ctx.fillStyle = 'rgba(255, 60, 120, 0.7)';
        ctx.shadowBlur = 20; ctx.shadowColor = '#ff0055';
        ctx.fillRect(l.x - l.w, l.y, l.w, l.h);
        ctx.shadowBlur = 0;
        if (!l.hit && l.y + l.h > py && l.y < py + ph && l.x > px && l.x - l.w < px + pw) { l.hit = true; playerHit(pcx, pcy); }
        return l.x - l.w > 0;
    });

    if (rival) {
        rival.update(); rival.draw();
        const b = rival.x < canvas.width ? rival.hitbox() : { x: -9999, y: -9999, w: 0, h: 0 }; // 画面外では被弾しない
        for (let i = bullets.length - 1; i >= 0; i--) {
            const q = bullets[i];
            if (q.x > b.x && q.x < b.x + b.w && q.y > b.y && q.y < b.y + b.h) { rival.hit(); bullets.splice(i, 1); }
        }
        for (let i = missiles.length - 1; i >= 0; i--) {
            const m = missiles[i];
            if (m.x > b.x && m.x < b.x + b.w && m.y > b.y && m.y < b.y + b.h) { rival.hit(); missiles.splice(i, 1); }
        }
        lasers.forEach(l => {
            if (rival.invuln === 0 && !l.rivalHit && l.y + l.h > b.y && l.y < b.y + b.h && l.x < b.x + b.w && l.x + l.w > b.x) { l.rivalHit = true; rival.hit(); }
        });
        if (rival.contactCd === 0 && Math.hypot(pcx - (rival.x + rival.width / 2), pcy - (rival.y + rival.height / 2)) < 30) {
            rival.contactCd = 60; playerHit(pcx, pcy);
        }
        drawRivalBar();
        if (rival.dead) {
            createExplosion(rival.x + rival.width / 2, rival.y + rival.height / 2, 80);
            score += 10000;
            rival = null;
            gameClear();
        }
    }

    if (now < warningUntil && Math.floor(now / 250) % 2 === 0) {
        ctx.fillStyle = '#ff2244'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center';
        ctx.fillText('WARNING!!', canvas.width / 2, canvas.height * 0.3);
        ctx.font = '20px Arial';
        ctx.fillText('自機と同じ装備の敵機が接近中', canvas.width / 2, canvas.height * 0.3 + 36);
        ctx.textAlign = 'left';
    }
}

// UIのゲージ表示を切り替える
function updateGauge(level) {
    for (let i = 1; i <= 8; i++) {
        const slot = document.getElementById(`slot-${i}`);
        if (level >= i) {
            slot.classList.add('active');
        } else {
            slot.classList.remove('active');
        }
    }
}

// 爆発エフェクト
function removeItem(arr, item) {
    const i = arr.indexOf(item);
    if (i >= 0) arr.splice(i, 1);
}

function createExplosion(x, y, count=10) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            radius: Math.random() * 4 + 2,
            alpha: 1,
            color: `hsl(${Math.random() * 50 + 10}, 100%, 50%)`
        });
    }
}

// ゲームループ
function gameLoop() {
    if (!gameActive) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 背景（星）の描画
    ctx.fillStyle = '#fff';
    stars.forEach(star => {
        star.x -= star.speed;
        if(star.x < 0) star.x = canvas.width;
        ctx.globalAlpha = 0.5;
        ctx.fillRect(star.x, star.y, star.size, star.size);
        ctx.globalAlpha = 1.0;
    });

    // 2. プレイヤーの更新・描画
    player.update();
    player.draw();

    // 3. 敵の出現
    enemySpawnTimer++;
    // レベルが上がるほど敵の出現パターンも猛烈に強化
    let spawnRate = player.powerLevel >= 7 ? 20 : 40;
    if (enemySpawnTimer > spawnRate) {
        let rand = Math.random();
        let type = 0;
        if (rand > 0.85) type = 1; // 中型
        else if (rand > 0.65) type = 2; // 高速
        enemies.push(new Enemy(type));
        enemySpawnTimer = 0;
    }

    // 4. 通常弾の移動・描画
    [...bullets].forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
        ctx.fillStyle = player.powerLevel >= 7 ? '#ffff00' : '#00ffff';
        ctx.fillRect(b.x, b.y - 2, 8, 4);

        // 画面外削除
        if (b.x > canvas.width || b.x < 0 || b.y > canvas.height || b.y < 0) {
            removeItem(bullets, b);
        }
    });

    // 5. レーザーの描画と成長（一瞬で画面端まで伸びる）
    [...lasers].forEach(l => {
        l.w += 40; // 伸長スピード
        ctx.fillStyle = player.powerLevel >= 8 ? 'rgba(255, 255, 255, 0.9)' : 'rgba(255, 0, 100, 0.7)';
        if (player.powerLevel >= 7) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0055';
        }
        ctx.fillRect(l.x, l.y, l.w, l.h);
        ctx.shadowBlur = 0;

        if (l.x + l.w > canvas.width) {
            removeItem(lasers, l); // 伸びきったら消去
        }
    });

    // 6. ミサイルの移動・描画
    [...missiles].forEach(m => {
        m.x += m.vx;
        m.y += m.vy;
        // 地形はないので、単純に画面下に落ちるか前進
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(m.x, m.y, 6, 6);

        if (m.x > canvas.width || m.y > canvas.height || m.y < 0) {
            removeItem(missiles, m);
        }
    });

    // 7. パワーアップカプセルの移動・描画
    [...capsules].forEach(c => {
        c.x -= 2;
        // 浮遊エフェクト
        c.y += Math.sin(c.x / 20) * 0.5;

        // 描画
        ctx.fillStyle = '#00ff00';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ff00';
        ctx.beginPath();
        ctx.arc(c.x, c.y, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Pの文字
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px Arial';
        ctx.fillText('P', c.x - 4, c.y + 4);

        // 自機との衝突判定
        let dist = Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y);
        if (dist < 25) {
            player.powerUp();
            removeItem(capsules, c);
        }

        if (c.x < -20) removeItem(capsules, c);
    });

    // 8. 敵の更新・衝突判定（撃破済みフラグで二重処理・誤削除を防ぐ）
    enemies.forEach(e => {
        if (e.dead) return;
        e.update();
        e.draw();
        const killIfDead = () => { if (!e.dead && e.hp <= 0) { e.dead = true; enemyDefeated(e); } };

        // 自機との衝突
        let playerDist = Math.hypot((player.x + player.width/2) - (e.x + e.width/2), (player.y + player.height/2) - (e.y + e.height/2));
        if (playerDist < (player.width/2 + e.width/2)) {
            if (player.barrierHealth > 0) {
                player.barrierHealth--;
                createExplosion(e.x + e.width/2, e.y + e.height/2, 15);
                e.dead = true;
                speak("シールド減少！");
            } else {
                gameOver();
            }
            return;
        }

        // 通常弾との衝突判定
        for (let i = bullets.length - 1; i >= 0 && !e.dead; i--) {
            const b = bullets[i];
            if (b.x > e.x && b.x < e.x + e.width && b.y > e.y && b.y < e.y + e.height) {
                e.hp -= b.power;
                bullets.splice(i, 1);
                killIfDead();
            }
        }

        // ミサイルとの衝突
        for (let i = missiles.length - 1; i >= 0 && !e.dead; i--) {
            const m = missiles[i];
            if (m.x > e.x && m.x < e.x + e.width && m.y > e.y && m.y < e.y + e.height) {
                e.hp -= 2;
                missiles.splice(i, 1);
                killIfDead();
            }
        }

        // レーザーとの衝突判定 (横軸の重なり)
        lasers.forEach(l => {
            if (!e.dead && l.y + l.h > e.y && l.y < e.y + e.height && l.x + l.w > e.x) {
                e.hp -= l.damage;
                killIfDead();
            }
        });

        // 画面外に出たら削除
        if (e.x < -50) e.dead = true;
    });
    enemies = enemies.filter(e => !e.dead);

    // 8.5 ライバル機
    updateRival(performance.now());

    // 9. パーティクルの更新・描画
    [...particles].forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        if (p.alpha <= 0) removeItem(particles, p);
    });

    // 10. スコア等テキスト描画
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    ctx.fillText(`LEVEL: ${player.powerLevel} [${POWER_UP_NAMES[player.powerLevel]}]`, 20, 65);
    if(player.barrierHealth > 0) {
        ctx.fillStyle = '#00aaff';
        ctx.fillText(`BARRIER: ${player.barrierHealth}`, 20, 95);
    }

    if (!gameActive) { drawEndScreen(); return; }
    requestAnimationFrame(gameLoop);
}

// 敵撃破時の処理
function enemyDefeated(e) {
    score += (e.type + 1) * 100;
    createExplosion(e.x + e.width/2, e.y + e.height/2, e.type === 1 ? 25 : 10);
    
    // カプセルのドロップ確率 (中型は確定、その他は確率)
    let dropChance = e.type === 1 ? 1.0 : 0.15;
    if (Math.random() < dropChance) {
        capsules.push({
            x: e.x + e.width/2,
            y: e.y + e.height/2
        });
    }
}

// ゲームオーバー／ゲームクリア
function showRestart() {
    startBtn.style.display = 'block';
    startBtn.innerText = 'RESTART';
    document.getElementById('ui-layer').style.pointerEvents = 'auto';
}

function gameOver() {
    if (!gameActive) return;
    gameActive = false; endState = 'over';
    speak("ゲームオーバー。あなたの戦いはここで終わりました。");
    showRestart();
}

function gameClear() {
    if (!gameActive) return;
    gameActive = false; endState = 'clear';
    speak("ゲームクリア！おめでとうございます！");
    showRestart();
}

function drawEndScreen() {
    const clear = endState === 'clear';
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = clear ? '#ffd700' : '#ff0055';
    ctx.font = 'bold 48px Arial';
    ctx.fillText(clear ? 'GAME CLEAR!' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 90);
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 - 50);
    ctx.textAlign = 'left';
}

// ゲーム開始処理
function initGame() {
    score = 0;
    bullets = [];
    lasers = [];
    missiles = [];
    options = [];
    enemies = [];
    capsules = [];
    particles = [];
    enemySpawnTimer = 0;
    
    rivalPhase = 0; rival = null; warningUntil = 0; fullPowerPickups = 0;
    enemyBullets = []; enemyLasers = []; enemyMissiles = [];
    endState = null;
    player = new Player();
    ctx.textAlign = 'left';
    gameActive = true;
    
    speak("ミッションスタート！行くわよ！");
    gameLoop();
}

// イベントリスナー
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyF' && !e.repeat) toggleFullscreen();
    if ((e.code === 'Enter' || e.code === 'NumpadEnter') && !e.repeat && !gameActive && startBtn.style.display !== 'none') {
        e.preventDefault();
        startGame();
    }
    // スペースキーでの画面スクロールを防止
    if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
        e.preventDefault();
    }
});
window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space') e.preventDefault();
});

document.getElementById('fs-btn').addEventListener('click', e => { toggleFullscreen(); e.currentTarget.blur(); });

function startGame() {
    if (gameActive) return;
    startBtn.style.display = 'none';
    document.getElementById('ui-layer').style.pointerEvents = 'none';
    initGame();
}
startBtn.addEventListener('click', startGame);

</script>
